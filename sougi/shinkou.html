body { margin: 0; min-height: 100vh; min-height: 100svh; }

  const forget = () => { try { localStorage.removeItem(storageKey); } catch (_) {} };
  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  async function decrypt(keys) {
    const macKey = await crypto.subtle.importKey('raw', keys.slice(32),
      {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
    const authenticated = new Uint8Array(iv.length + ciphertext.length);
    authenticated.set(iv); authenticated.set(ciphertext, iv.length);
    if (!await crypto.subtle.verify('HMAC', macKey, tag, authenticated)) {
      throw new Error('合言葉が違います');
    }
    const aesKey = await crypto.subtle.importKey('raw', keys.slice(0, 32),
      'AES-CBC', false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({name: 'AES-CBC', iv}, aesKey, ciphertext);
    return new TextDecoder('utf-8', {fatal: true}).decode(plaintext);
  }
  function show(html) {
    password.value = '';
    document.open(); document.write(html); document.close();
    // 差し替え後はブラウザが window の load を送り直さないため、届かなかったときだけ代わりに送る
    let loaded = false;
    window.addEventListener('load', () => { loaded = true; }, {once: true});
    const fireLoad = () => setTimeout(() => {
      if (!loaded) window.dispatchEvent(new Event('load'));
    }, 0);
    if (document.readyState === 'complete') fireLoad();
    else document.addEventListener('readystatechange', function onChange() {
      if (document.readyState !== 'complete') return;
      document.removeEventListener('readystatechange', onChange);
      fireLoad();
    });
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    message.textContent = '確認しています…';
    if (!remember.checked) forget();
    try {
      const material = await crypto.subtle.importKey('raw',
        new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveBits']);
      const keys = new Uint8Array(await crypto.subtle.deriveBits(
        {name: 'PBKDF2', salt, iterations: data.iterations, hash: 'SHA-256'}, material, 512));
      const html = await decrypt(keys);
      if (remember.checked) {
        try { localStorage.setItem(storageKey, hex(keys)); } catch (_) {}
      }
      show(html);
    } catch (error) {
      message.textContent = error.message === '合言葉が違います'
        ? error.message : '復号できませんでした。ページを再読み込みしてお試しください。';
      button.disabled = false;
    }
  });
  async function init() {
    if (!window.crypto || !window.crypto.subtle) {
      message.textContent = 'このブラウザでは復号できません。HTTPSで開いてください。';
      return;
    }
    let saved = null;
    try { saved = localStorage.getItem(storageKey); } catch (_) {}
    if (saved !== null) {
      message.textContent = '確認しています…';
      try {
        if (!/^[0-9a-f]{128}$/i.test(saved)) throw new Error('invalid key');
        const keys = Uint8Array.from(saved.match(/../g), value => parseInt(value, 16));
        show(await decrypt(keys));
        return;
      } catch (_) { forget(); }
    }
    message.textContent = '';
    button.disabled = false;
  }
  // 読み込み途中で document.open すると置き換わらず追記されるため、読み込み完了を待つ
  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init, {once: true});
})();
</script>
</body>
